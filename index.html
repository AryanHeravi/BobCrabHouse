<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bob's Crab House</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
        }

        /* =========================
           LOADER
        ========================= */

        .loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            /* PURE BLACK BACKGROUND */
            background: #000;

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }

        .loader.finished {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* =========================
           SUBTLE BLACK ATMOSPHERE
        ========================= */

        .ocean-glow {
            position: absolute;
            left: 50%;
            top: 42%;

            width: 130vw;
            height: 45vh;

            transform: translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    ellipse,
                    rgba(255, 255, 255, 0.035),
                    transparent 65%
                );

            filter: blur(35px);

            animation: oceanGlow 7s ease-in-out infinite;
        }

        @keyframes oceanGlow {
            0% {
                transform:
                    translateX(-50%)
                    translateY(0)
                    scaleX(1);
            }

            50% {
                transform:
                    translateX(-47%)
                    translateY(-12px)
                    scaleX(1.05);
            }

            100% {
                transform:
                    translateX(-50%)
                    translateY(0)
                    scaleX(1);
            }
        }

        /* =========================
           SUBTLE WAVES
        ========================= */

        .waves {
            position: absolute;
            left: -10%;
            bottom: -5%;

            width: 120%;
            height: 45%;

            opacity: 0.08;
        }

        .wave {
            position: absolute;

            left: -5%;

            width: 110%;
            height: 100px;

            border-top:
                1px solid
                rgba(247, 240, 223, 0.45);

            border-radius: 50%;

            animation:
                waveMovement 7s ease-in-out infinite;
        }

        .wave:nth-child(1) {
            bottom: 25%;
        }

        .wave:nth-child(2) {
            bottom: 13%;
            opacity: 0.6;
            animation-delay: -2s;
        }

        .wave:nth-child(3) {
            bottom: 2%;
            opacity: 0.35;
            animation-delay: -4s;
        }

        @keyframes waveMovement {

            0% {
                transform: translateX(-3%);
            }

            50% {
                transform: translateX(3%);
            }

            100% {
                transform: translateX(-3%);
            }
        }

        /* =========================
           PARTICLES
        ========================= */

        .particles {
            position: absolute;
            inset: 0;

            pointer-events: none;
        }

        .particle {
            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background:
                rgba(247, 240, 223, 0.3);

            animation:
                floatParticle 4s linear infinite;
        }

        .particle:nth-child(1) {
            left: 12%;
            bottom: 15%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            left: 23%;
            bottom: 22%;
            animation-delay: 1.2s;
        }

        .particle:nth-child(3) {
            left: 36%;
            bottom: 12%;
            animation-delay: 0.5s;
        }

        .particle:nth-child(4) {
            left: 49%;
            bottom: 18%;
            animation-delay: 2s;
        }

        .particle:nth-child(5) {
            left: 63%;
            bottom: 14%;
            animation-delay: 1s;
        }

        .particle:nth-child(6) {
            left: 74%;
            bottom: 24%;
            animation-delay: 2.5s;
        }

        .particle:nth-child(7) {
            left: 84%;
            bottom: 16%;
            animation-delay: 0.8s;
        }

        .particle:nth-child(8) {
            left: 92%;
            bottom: 21%;
            animation-delay: 1.8s;
        }

        @keyframes floatParticle {

            0% {
                transform: translateY(30px);
                opacity: 0;
            }

            25% {
                opacity: 0.4;
            }

            100% {
                transform: translateY(-130px);
                opacity: 0;
            }
        }

        /* =========================
           CONTENT
        ========================= */

        .loader-content {
            position: relative;
            z-index: 10;

            display: flex;
            flex-direction: column;
            align-items: center;

            width: 100%;
            padding: 30px;
        }

        /* =========================
           ESTABLISHED TEXT
        ========================= */

        .established {
            display: flex;
            align-items: center;
            gap: 18px;

            margin-bottom: 25px;

            opacity: 0;
            transform: translateY(15px);

            animation:
                fadeUp 0.8s ease forwards 0.15s;
        }

        .established-line {
            width: 45px;
            height: 1px;

            background:
                rgba(247, 240, 223, 0.4);
        }

        .established-text {
            color: #f7f0df;

            font-size: 10px;
            font-weight: 600;

            letter-spacing: 0.35em;
            text-transform: uppercase;
        }

        /* =========================
           LOGO
        ========================= */

        .logo-wrapper {
            position: relative;

            width: min(78vw, 480px);

            opacity: 0;
            transform:
                scale(0.82)
                translateY(20px);

            animation:
                logoEnter
                1.2s
                cubic-bezier(.16, 1, .3, 1)
                forwards
                0.15s;
        }

        /* GOLD LOGO GLOW */

        .logo-glow {
            position: absolute;
            inset: 15%;

            background:
                radial-gradient(
                    circle,
                    rgba(213, 151, 54, 0.20),
                    transparent 70%
                );

            border-radius: 50%;

            filter: blur(45px);

            animation:
                logoGlow
                3s
                ease-in-out
                infinite;
        }

        .logo {
            position: relative;
            z-index: 2;

            display: block;

            width: 100%;
            height: auto;

            filter:
                drop-shadow(
                    0 25px 45px
                    rgba(0, 0, 0, 0.85)
                );
        }

        @keyframes logoEnter {

            0% {
                opacity: 0;

                transform:
                    scale(0.82)
                    translateY(20px);

                filter: blur(8px);
            }

            60% {
                opacity: 1;
                filter: blur(0);
            }

            100% {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }

        @keyframes logoGlow {

            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.95);
            }

            50% {
                opacity: 0.9;
                transform: scale(1.08);
            }
        }

        /* =========================
           TAGLINE
        ========================= */

        .tagline {
            margin-top: 24px;

            text-align: center;

            opacity: 0;
            transform: translateY(12px);

            animation:
                fadeUp
                0.8s
                ease
                forwards
                0.85s;
        }

        .tagline-main {
            color: #f7f0df;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 0.42em;
            text-transform: uppercase;
        }

        .tagline-sub {
            margin-top: 9px;

            color:
                rgba(247, 240, 223, 0.42);

            font-size: 13px;
            font-weight: 300;

            letter-spacing: 0.08em;
        }

        /* =========================
           LOADING BAR
        ========================= */

        .loading-container {
            width: min(270px, 75vw);

            margin-top: 38px;

            opacity: 0;
            transform: translateY(10px);

            animation:
                fadeUp
                0.8s
                ease
                forwards
                1s;
        }

        .loading-info {
            display: flex;
            justify-content: space-between;

            margin-bottom: 10px;
        }

        .loading-label,
        .loading-percent {
            color:
                rgba(247, 240, 223, 0.4);

            font-size: 9px;
            font-weight: 500;

            letter-spacing: 0.25em;
            text-transform: uppercase;
        }

        .loading-track {
            position: relative;

            width: 100%;
            height: 2px;

            overflow: hidden;

            background:
                rgba(247, 240, 223, 0.12);
        }

        .loading-progress {
            position: absolute;

            left: 0;
            top: 0;

            width: 0%;
            height: 100%;

            background: #f7f0df;

            box-shadow:
                0 0 10px
                rgba(247, 240, 223, 0.5);

            animation:
                loadingProgress
                4s
                linear
                forwards;
        }

        @keyframes loadingProgress {

            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }

        /* =========================
           BOTTOM BRAND
        ========================= */

        .bottom-brand {
            position: absolute;

            bottom: 28px;
            left: 0;

            width: 100%;

            text-align: center;

            opacity: 0;

            animation:
                fadeIn
                1s
                ease
                forwards
                1.3s;
        }

        .bottom-brand span {
            color:
                rgba(247, 240, 223, 0.25);

            font-size: 9px;
            font-weight: 500;

            letter-spacing: 0.45em;
            text-transform: uppercase;
        }

        /* =========================
           GENERIC ANIMATIONS
        ========================= */

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .logo-wrapper {
                width: min(88vw, 430px);
            }

            .established {
                margin-bottom: 15px;
            }

            .established-text {
                font-size: 8px;
                letter-spacing: 0.25em;
            }

            .established-line {
                width: 30px;
            }

            .tagline-main {
                font-size: 9px;
                letter-spacing: 0.3em;
            }

            .tagline-sub {
                font-size: 11px;
            }

            .loading-container {
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         LOADING SCREEN
    ========================= -->

    <div class="loader" id="loader">

        <!-- Subtle atmosphere -->
        <div class="ocean-glow"></div>

        <!-- Subtle waves -->
        <div class="waves">

            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>

        </div>

        <!-- Floating particles -->
        <div class="particles">

            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>

        </div>


        <!-- Main content -->
        <div class="loader-content">

            <!-- Established -->
            <div class="established">

                <div class="established-line"></div>

                <span class="established-text">
                    Est. 2009
                </span>

                <div class="established-line"></div>

            </div>


            <!-- Logo -->
            <div class="logo-wrapper">

                <div class="logo-glow"></div>

                <img
                    src="/BobCrabHouse/img/logo.png"
                    alt="Bob's Crab House"
                    class="logo"
                >

            </div>


            <!-- Tagline -->
            <div class="tagline">

                <div class="tagline-main">
                    Fresh From The Coast
                </div>

                <div class="tagline-sub">
                    Get ready to crack into something good.
                </div>

            </div>


            <!-- Loading -->
            <div class="loading-container">

                <div class="loading-info">

                    <span class="loading-label">
                        Preparing the catch
                    </span>

                    <span
                        class="loading-percent"
                        id="percentage"
                    >
                        0%
                    </span>

                </div>

                <div class="loading-track">

                    <div
                        class="loading-progress"
                        id="progress"
                    ></div>

                </div>

            </div>

        </div>


        <!-- Bottom -->
        <div class="bottom-brand">

            <span>
                Bob's Crab House
            </span>

        </div>

    </div>


    <!-- =========================
         YOUR WEBSITE
    ========================= -->

    <main id="website">

        <h1>Your Website</h1>

    </main>


    <script>

        /*
         * =========================================
         * 4 SECOND LOADING SYSTEM
         * =========================================
         */

        const loader =
            document.getElementById("loader");

        const percentage =
            document.getElementById("percentage");

        const duration = 4000;

        const startTime =
            performance.now();


        function updateLoader(currentTime) {

            const elapsed =
                currentTime - startTime;

            const progress =
                Math.min(
                    elapsed / duration,
                    1
                );


            /*
             * Update percentage
             */

            const percent =
                Math.floor(progress * 100);

            percentage.textContent =
                percent + "%";


            /*
             * Continue animation
             */

            if (progress < 1) {

                requestAnimationFrame(
                    updateLoader
                );

            } else {

                /*
                 * Loading is complete
                 */

                setTimeout(() => {

                    loader.classList.add(
                        "finished"
                    );

                    /*
                     * Restore scrolling
                     */

                    document.body.style.overflow =
                        "auto";


                    /*
                     * Redirect to main website
                     */

                    setTimeout(() => {

                        window.location.replace(
                            "main.html"
                        );

                    }, 300);

                }, 100);

            }
        }


        /*
         * =========================================
         * START LOADING
         * =========================================
         */

        document.body.style.overflow =
            "hidden";

        requestAnimationFrame(
            updateLoader
        );

    </script>

</body>
</html>
